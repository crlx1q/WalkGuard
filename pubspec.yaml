name: walkguard
description: Offline on-device pedestrian attention assistant for Android.
publish_to: none
version: 0.3.1+4
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/Apache-2.0.txt
    - assets/licenses/NOTICE.txt
    - assets/fonts/OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
